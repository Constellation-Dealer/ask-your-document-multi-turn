name: checks

# ingestion — the Step 2 poll loop waits for TargetUMH to finish indexing. UMH
#   also answers Skipped (a PDF with no text layer -- a scan), which a loop
#   written as "break on Completed, throw on Failed" matches neither way, so it
#   spins forever with nothing on screen. That is not hypothetical: it shipped
#   here, on both branches, and 36% of this dealer's recent uploads come back
#   Skipped. Asserts the loop SETTLES and settles the RIGHT way, rather than
#   checking for particular strings, so `main` and `solution` are both covered
#   by the same check with nothing skipped.
#
# poll-step — settling is necessary and not sufficient: the participant reads
#   the trace, not the exception. Asserts the Poll card ends up showing the
#   status that stopped it instead of keeping its last in-flight text.
#
# Both are driven in a real headless Chrome over CDP with the network stubbed,
# so they exercise the shipped helpers.js and loop.js rather than a copy of the
# logic. Nothing is installed: ubuntu-latest ships node and Chrome, and the
# static server is python3's own. No npm package is fetched at check time.

on:
  push:
    branches: [main, solution]
  pull_request:
  workflow_dispatch:

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Serve the app
        # python3's own static server, not `npx --yes http-server`: that would
        # fetch and execute the latest unpinned npm package on every run, which
        # is a supply-chain execution path a static-file check does not need.
        run: |
          python3 -m http.server 5198 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5198/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5198/ || { echo "server never came up"; cat /tmp/http.log; exit 1; }

      - name: Start headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          [ -n "$CHROME" ] || { echo "no Chrome on this runner"; exit 1; }
          "$CHROME" --headless=new --disable-gpu --no-sandbox \
            --remote-debugging-port=9334 --user-data-dir=/tmp/cdp-ingestion about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:9334/json/version && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:9334/json/version || { echo "Chrome never exposed CDP"; cat /tmp/chrome.log; exit 1; }

      - name: Drive the ingestion poll
        env:
          APP_URL: http://127.0.0.1:5198/
          CDP_URL: http://127.0.0.1:9334
        run: node .github/scripts/test-ingestion.mjs

      - name: Check the Poll step reports what stopped it
        env:
          APP_URL: http://127.0.0.1:5198/
          CDP_URL: http://127.0.0.1:9334
        run: node .github/scripts/test-poll-step.mjs
